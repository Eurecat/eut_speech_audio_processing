name: coghri_audio_mp3_test

services:
  mongodb_service:
    image: mongo:7
    container_name: mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      - MONGO_INITDB_ROOT_USERNAME=eurecat
      - MONGO_INITDB_ROOT_PASSWORD=cerdanyola
    stop_signal: SIGTERM
    stop_grace_period: 60s

  speech_recognition_service:
    container_name: speech_recognition
    network_mode: host
    ipc: host
    shm_size: 1gb
    runtime: ${DOCKER_RUNTIME:-runc}
    image: ${BUILT_IMAGE}
    privileged: true
    depends_on:
      - mongodb_service

    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ~/.xauth_docker/share/:/tmp/xauth/
      - ./logs:/workspace/log
      - ../src/audio_stream_manager:/workspace/src/audio_stream_manager
      - ../src/speech_recognition:/workspace/src/speech_recognition
      - ../src/speech_recognition/speech_recognition/weights_pyannote:/root/.cache/torch/pyannote:rw
      - ./cyclone_xmls/${CYCLONE_CONFIG_FILE:-eth_tiago_cyclone.xml}:/etc/cyclonedds.xml:ro

    tty: true
    stdin_open: true

    environment:
      - CYCLONEDDS_URI=file:///etc/cyclonedds.xml
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-2}
      - RMW_IMPLEMENTATION=${RMW_IMPLEMENTATION:-rmw_fastrtps_cpp}
      - FASTDDS_BUILTIN_TRANSPORTS=${FASTDDS_BUILTIN_TRANSPORTS:-UDPv4}
      - PACKAGE_NAME=speech_recognition
      - BUILD_LOGS_TO_KEEP=${BUILD_LOGS_TO_KEEP:-2}
      - RUNTIME_LOGS_TO_KEEP=${RUNTIME_LOGS_TO_KEEP:-2}
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      - DISPLAY=$DISPLAY
      - QT_X11_NO_MITSHM=1
      - XAUTHORITY=/tmp/xauth/.docker.xauth
      - HF_TOKEN=${HF_TOKEN}
      - HF_HOME=/root/.cache/torch/pyannote
      - TORCH_HOME=/root/.cache/torch
      - AI_VENV=/opt/ros_python_env

    devices:
      - /dev/dri:/dev/dri

    command: >
      bash -c "source /workspace/install/setup.bash &&
      exec ros2 launch speech_recognition speech_recognition.launch.py
      enable_vad:=true
      enable_diarization:=true
      enable_asr:=true
      enable_wake_word:=false
      diarization_backend:=${DIARIZATION_BACKEND:-diart}
      redi_use_database:=${REDI_USE_DATABASE:-false}"

    stop_signal: SIGINT
    stop_grace_period: 30s

  mp3_audio_source:
    container_name: mp3_audio_source
    network_mode: host
    ipc: host
    image: ${BUILT_IMAGE}
    depends_on:
      - speech_recognition_service

    volumes:
      - ../src/audio_stream_manager:/workspace/src/audio_stream_manager:ro
      - ./audio_samples:/workspace/audio_samples:ro
      - ./cyclone_xmls/${CYCLONE_CONFIG_FILE:-eth_tiago_cyclone.xml}:/etc/cyclonedds.xml:ro

    environment:
      - CYCLONEDDS_URI=file:///etc/cyclonedds.xml
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-2}
      - RMW_IMPLEMENTATION=${RMW_IMPLEMENTATION:-rmw_fastrtps_cpp}
      - FASTDDS_BUILTIN_TRANSPORTS=${FASTDDS_BUILTIN_TRANSPORTS:-UDPv4}
      - AI_VENV=/opt/ros_python_env
      - AUDIO_PUBLISHER_

    # The Python publisher is embedded in this compose as base64.
    # No ./audio_file_publisher.py bind mount is needed.
    command: >
      bash -c "printf '%s' \"$${AUDIO_PUBLISHER_B64}\" |
      base64 -d > /tmp/audio_file_publisher.py &&
      source /workspace/install/setup.bash &&
      exec python3 /tmp/audio_file_publisher.py
      --ros-args
      -p input_file:=${AUDIO_FILE:-/workspace/src/audio_stream_manager/four_speakers.mp3}
      -p sample_rate:=16000
      -p chunk_size:=512
      -p tail_silence:=2.0
      -p ready_delay:=2.0"

    stop_signal: SIGINT
    stop_grace_period: 10s

volumes:
  mongodb_data:
    name: coghri_speakers_mongodb_data
    driver: local