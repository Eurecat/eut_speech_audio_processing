# ROS2 Parameters for Diarization Node
# This file contains all the configurable parameters for the DiarizationNode

diarization_node:
  ros__parameters:
    # Audio Processing Configuration
    chunk_duration: 1.0                     # Duration (seconds) of audio chunks for diarization
    overlap_duration: 0.5                   # Overlap (seconds) between consecutive chunks
    step_duration: 0.5                      # Sliding-window step (seconds). Lower = finer speaker
                                            # change resolution but more compute.
    
    # Diart clustering (online speaker tracking)
    tau_active: 0.5                         # Min. activity probability for a speaker to count as active
    delta_new: 0.90                         # Cosine-distance threshold to spawn a NEW speaker.
                                            # Raise (e.g. 0.95) to fight over-segmentation.
    max_speakers: 10                        # Upper bound of concurrently tracked speakers
    
    # Model Configuration
    segmentation_model_name: "pyannote/segmentation"  # Model name for speaker segmentation
    embedding_model_name: "pyannote/embedding"        # Model name for speaker embedding
    diarization_backend: "redimnet2"                       # diart (legacy) or redimnet2

    # ReDimNet2 backend (used only when diarization_backend=redimnet2)
    redi_repository: "PalabraAI/redimnet2:c5bbe0b76e37df698c403f8844e41304ceab6307"  # Pin source for
                                                        # reproducible torch.hub loading. NOT the "v1.0.0"
                                                        # tag: that tag predates the b6/vb2+vox2+cnc2_v0
                                                        # checkpoint (added upstream commit e8bfa167,
                                                        # 2026-04-23, "agg_gnorm" support) and was uploaded
                                                        # to the same v1.0.0 release without a new tag, so
                                                        # the tag's code cannot load this checkpoint's config
                                                        # (TypeError: unexpected keyword argument 'agg_gnorm').
                                                        # Pinned instead to upstream main HEAD as of 2026-09-15.
    redi_model_name: "b6"
    redi_train_type: "lm"                              # Large-margin checkpoint (recommended upstream)
    redi_dataset: "vb2+vox2+cnc2_v0"
    redi_match_threshold: 0.68                         # Absolute identity match threshold
    redi_match_margin: 0.08                            # Required top-1 minus top-2 margin
    redi_continue_threshold: 0.58                      # Lower threshold for track hysteresis
    redi_switch_threshold: 0.74                        # Strong evidence required to switch identity
    redi_update_threshold: 0.72                        # Guard identity centroid/prototype updates
    redi_min_update_quality: 0.70                      # Minimum external VAD probability
    redi_min_confirm_embeddings: 3                     # Provisional -> confirmed lifecycle
    redi_min_confirm_seconds: 1.5
    redi_max_prototypes: 6                             # Bounded acoustic-condition prototype bank
    redi_mongo_uri: ""                                 # Empty uses MONGODB_URI or local legacy default
    
    # VAD Integration
    vad_threshold: 0.5                        # VAD threshold for publishing speech activity (kept aligned with the ASR gate)

    # Diarization 
    use_database: False                          # Whether to use MongoDB for storing diarization results
    similarity_threshold: 0.35                  # Cosine distance threshold below which two DIART speakers are merged into one EUT speaker (lower = stricter, higher = more merging)
    init_retry_backoff_sec: 10.0                # Delay between failed engine initialization retries