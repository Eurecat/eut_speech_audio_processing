# ROS2 Parameters for ASR (Automatic Speech Recognition) Node
# This file contains all the configurable parameters for the ASRNode

asr_node:
  ros__parameters:
    # Backend Configuration
    asr_backend: "whisper"                   # whisper: faster-whisper (all languages, including Catalan)
                                             # parakeet: NVIDIA NeMo Parakeet TDT (faster, 25 European languages)
                                             # Both publish the same /speech_result with the same speaker attribution.
                                             # Override without editing this file: ASR_BACKEND in Docker/.env
                                             # (launch argument asr_backend).

    # Parakeet backend (used only when asr_backend=parakeet)
    parakeet_model_name: "nvidia/parakeet-tdt-0.6b-v3"  # Hugging Face repo id or path to a .nemo file.
                                             # Downloaded once to speech_recognition/weights.
                                             # WARNING: Catalan ('ca') is NOT supported (Spanish is).
                                             # Keep asr_backend=whisper where Catalan matters.
                                             # Parakeet does not report the language it heard:
                                             # the first code of `language` is published.

    # Whisper Model Configuration (model_size, compute_type and batched inference are ignored by parakeet)
    model_size: "turbo"                      # Whisper model size (tiny, base, small, medium, large, turbo)
    compute_type: "float16"                  # Compute type: float32, float16, int8, int8_float32, int8_float16, int16
                        # CUDA device: float16 is ~2x faster than float32. The engine auto-falls back to float32 on CPU.
                        # Parakeet always runs float32.
    
    # Language Configuration
    language: "en, es, ca"                           # Language options:
                                            #   - "auto": Auto-detect language
                                            #   - "en": English only
                                            #   - "es,fr,de": Comma-separated allow-list, best of the listed languages is picked
                                            # NOTE: forcing a language makes Whisper transcribe *into* that
                                            # language. For the English test mp3 keep "en" to avoid spurious
                                            # Spanish/Catalan output.
                                            
    # Batched Inference Configuration
    use_batched_inference: true             # Enable batched inference for better throughput
    batch_size: 16                           # Batch size for batched inference
    
    # VAD and Speech Detection
    vad_threshold: 0.5                       # VAD probability threshold for speech detection
                                             # (Silero speech is ~0.9-1.0, silence ~0.0-0.05. 0.95 clipped
                                             #  word onsets and dropped short utterances.)
    silence_detection_threshold: 0.00001     # RMS threshold for silence detection
    
    # Timing Parameters
    min_silence_duration: 0.45               # Minimum silence duration (seconds) before processing speech
    max_chunk_duration: 30.0                 # Maximum duration (seconds) of a single speech chunk
    pre_buffer_duration: 0.5                 # Duration (seconds) of audio to prepend to speech chunks
    diarization_offset: -1.0                  # Signed correction (seconds) applied to diarization speaker
                                             # change events so they line up with the audio they describe.
                                             # Positive shifts events later. Tune by watching where a
                                             # multi-speaker chunk gets split.
    min_speaker_run_tokens: 2                # A speaker run shorter than this many words is treated as
                                             # word-timestamp flicker and merged into the previous run
                                             # (only used when snap_splits_to_sentences is false)
    min_speaker_run_duration: 0.4            # Same, expressed as a minimum duration (seconds)
    snap_splits_to_sentences: true           # Label whole sentences with their majority speaker so a
                                             # noisy speaker boundary can never split a sentence in half.
                                             # Set false for raw per-word attribution.
    speaker_interval_tolerance: 3.0          # How far (seconds) outside a chunk a speaker report may be
                                             # and still be used as the fallback
    min_speaker_chunk_duration: 1.0          # Minimum audio (seconds) before a speaker change is allowed to
                                             # flush and publish the utterance built so far
    
    # ROS4HRI Configuration
    ros4hri_with_id: false                    # Enable ROS4HRI LiveSpeech messages
    cleanup_inactive_topics: false           # Clean up inactive speaker topics
    inactive_topic_timeout: 10.0             # Timeout for inactive topic cleanup
